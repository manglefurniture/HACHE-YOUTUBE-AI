name: Build Clore Ubuntu ComfyUI image

on:
  pull_request:
    paths:
      - 'clore/ubuntu.Dockerfile'
      - 'scripts/clore-ubuntu-onstart.sh'
      - 'scripts/test_clore_ubuntu_onstart.sh'
      - '.github/workflows/clore-ubuntu-image.yml'
      - 'docs/CLORE-UBUNTU-AUTOSSH.md'
  push:
    branches: [main]
    paths:
      - 'clore/ubuntu.Dockerfile'
      - 'scripts/clore-ubuntu-onstart.sh'
      - 'scripts/test_clore_ubuntu_onstart.sh'
      - '.github/workflows/clore-ubuntu-image.yml'
      - 'docs/CLORE-UBUNTU-AUTOSSH.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate startup, SSH division of ownership, and image configuration
        run: |
          bash -n scripts/clore-ubuntu-onstart.sh scripts/test_clore_ubuntu_onstart.sh
          bash scripts/test_clore_ubuntu_onstart.sh
          grep -Fq 'FROM nvidia/cuda:13.0.2-cudnn-runtime-ubuntu24.04' clore/ubuntu.Dockerfile
          grep -Fq 'COPY scripts/clore-ubuntu-onstart.sh /root/onstart.sh' clore/ubuntu.Dockerfile
          grep -Fq 'torch==2.13.0 torchvision==0.28.0' clore/ubuntu.Dockerfile
          grep -Fq 'torch.version.cuda.startswith("13.")' clore/ubuntu.Dockerfile
          ! grep -iE 'apt-get[[:space:]]+(upgrade|dist-upgrade)|systemctl|sshd -D|ssh-keygen -A' scripts/clore-ubuntu-onstart.sh
  image:
    needs: offline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish only after merge
        uses: docker/build-push-action@v6
        with:
          context: .
          file: clore/ubuntu.Dockerfile
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/manglefurniture/hache-clore-comfyui-ubuntu:sha-${{ github.sha }}
            ghcr.io/manglefurniture/hache-clore-comfyui-ubuntu:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/manglefurniture/HACHE-YOUTUBE-AI
