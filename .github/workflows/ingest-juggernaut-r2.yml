name: Ingest Juggernaut XL Ragnarok to R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juggernaut-r2-ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Credentials are exposed only to an explicitly dispatched workflow on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned S3 client
        run: python -m pip install --disable-pip-version-check --no-input boto3==1.35.99

      - name: Download official source, upload to shared prefix, and verify R2 readback
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python scripts/ingest_juggernaut_r2.py
